<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Góc Học Tập Nhỏ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
  <style>
    body{min-height:100vh;background:linear-gradient(180deg,#f0f9ff,#ecfeff)}
    .card{transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-2px);box-shadow:0 10px 24px #0ea5e914}
    .status{border-radius:999px;color:#fff;font-size:.7rem;font-weight:700;padding:.25rem .6rem;text-transform:uppercase}
  </style>
</head>
<body class="font-sans text-gray-800">
  <header class="bg-white shadow-sm border-b border-sky-100">
    <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-2xl font-extrabold text-sky-600"><i class="fas fa-graduation-cap mr-2"></i>Góc Học Tập</h1>
      <div id="userInfo" class="hidden items-center gap-3">
        <span id="userNameDisplay" class="font-semibold"></span>
        <button onclick="logout()" class="text-red-500 text-sm"><i class="fas fa-sign-out-alt"></i> Đăng xuất</button>
      </div>
    </div>
  </header>

  <main id="loginScreen" class="min-h-[calc(100vh-72px)] flex items-center justify-center p-4">
    <section class="bg-white w-full max-w-md rounded-3xl shadow-xl border border-sky-100 p-8">
      <div class="text-center mb-6"><div class="inline-flex w-16 h-16 rounded-full bg-sky-100 text-sky-600 items-center justify-center text-2xl mb-3"><i class="fas fa-home"></i></div><h2 class="text-2xl font-bold">Đăng Nhập Gia Đình</h2></div>
      <input id="familyCode" class="w-full mb-3 p-3 border rounded-xl" placeholder="Mã gia đình" autocomplete="off" />
      <input id="username" class="w-full mb-5 p-3 border rounded-xl" placeholder="Tên phụ huynh hoặc tên bé" autocomplete="name" />
      <div class="grid grid-cols-2 gap-3">
        <button onclick="login('parent')" class="bg-sky-500 hover:bg-sky-600 text-white p-3 rounded-xl font-semibold"><i class="fas fa-user-tie mr-1"></i>Phụ Huynh</button>
        <button onclick="login('student')" class="bg-green-500 hover:bg-green-600 text-white p-3 rounded-xl font-semibold"><i class="fas fa-child mr-1"></i>Học Sinh</button>
      </div>
      <p class="text-xs text-gray-500 mt-4">Mã gia đình chỉ giúp phân loại dữ liệu, không thay thế đăng nhập bảo mật.</p>
    </section>
  </main>

  <main id="parentDashboard" class="hidden max-w-6xl mx-auto p-4 md:py-8">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
      <aside class="bg-white rounded-3xl shadow p-5 h-fit">
        <h2 class="font-bold text-xl text-sky-700 mb-4"><i class="fas fa-robot mr-2"></i>Soạn bài với AI</h2>
        <label class="block text-sm mb-1" for="geminiApiKey">Gemini API key (chỉ lưu trong phiên này)</label>
        <input id="geminiApiKey" type="password" autocomplete="off" class="w-full mb-4 p-3 border rounded-xl" placeholder="Nhập API key" />
        <label class="block text-sm mb-1" for="subject">Môn học</label>
        <select id="subject" class="w-full mb-4 p-3 border rounded-xl">
          <option>Toán</option><option>Tiếng Việt</option><option>Tiếng Anh</option><option>Khoa Học</option><option>Đạo Đức</option><option>Lịch Sử và Địa Lý</option>
        </select>
        <div class="flex items-center gap-3 mb-4"><input id="questionCount" type="number" min="1" max="20" value="5" class="w-24 p-3 border rounded-xl" /><span class="text-sm text-gray-600">câu hỏi</span></div>
        <label class="block text-sm mb-1" for="aiPrompt">Gợi ý thêm</label>
        <textarea id="aiPrompt" rows="3" class="w-full mb-4 p-3 border rounded-xl" placeholder="Ví dụ: bài toán vui, phù hợp học sinh lớp 2"></textarea>
        <button id="generateBtn" onclick="generateTasks()" class="w-full bg-purple-500 hover:bg-purple-600 text-white p-3 rounded-xl font-bold"><i class="fas fa-magic mr-2"></i>Tạo bài tập</button>
      </aside>

      <section class="lg:col-span-2 space-y-5">
        <div class="bg-white rounded-3xl shadow p-5">
          <h2 class="font-bold text-xl mb-4"><i class="fas fa-users mr-2"></i>Quản lý học sinh</h2>
          <div class="flex flex-col sm:flex-row gap-2">
            <input id="newStudentName" class="flex-1 p-3 border rounded-xl" placeholder="Tên bé mới" />
            <button onclick="addStudent()" class="bg-green-500 hover:bg-green-600 text-white px-4 py-3 rounded-xl"><i class="fas fa-plus mr-1"></i>Thêm bé</button>
          </div>
          <div class="flex items-center gap-3 mt-4"><label for="studentSelect" class="text-sm font-medium">Đang xem bé:</label><select id="studentSelect" class="flex-1 max-w-sm p-3 border rounded-xl"></select></div>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
          <div class="bg-white rounded-2xl p-4 text-center shadow"><b id="statTotal" class="block text-2xl text-sky-600">0</b><span>Tổng bài</span></div>
          <div class="bg-white rounded-2xl p-4 text-center shadow"><b id="statSubmitted" class="block text-2xl text-yellow-600">0</b><span>Đã nộp</span></div>
          <div class="bg-white rounded-2xl p-4 text-center shadow"><b id="statGraded" class="block text-2xl text-green-600">0</b><span>Đã chấm</span></div>
          <div class="bg-white rounded-2xl p-4 text-center shadow"><b id="statStars" class="block text-2xl text-orange-600">0</b><span>Sao</span></div>
        </div>
        <div class="bg-white rounded-3xl shadow p-5"><h2 class="font-bold text-xl mb-4"><i class="fas fa-trophy mr-2 text-orange-500"></i>Bảng xếp hạng</h2><div id="leaderboard" class="space-y-2"></div></div>
        <div class="bg-white rounded-3xl shadow p-5"><h2 class="font-bold text-xl mb-4"><i class="fas fa-history mr-2"></i>Lịch sử bài tập</h2><div id="parentTaskList" class="space-y-4"></div></div>
      </section>
    </div>
  </main>

  <main id="studentDashboard" class="hidden max-w-5xl mx-auto p-4 md:py-8">
    <section class="bg-white rounded-3xl shadow-xl border-4 border-green-200 p-5 md:p-7">
      <div class="flex flex-col sm:flex-row justify-between items-center gap-3 mb-6"><h2 class="text-2xl font-extrabold text-green-600">🌟 BÀI TẬP CỦA CON 🌟</h2><div class="bg-orange-50 border border-orange-200 rounded-full px-4 py-2 text-orange-700 font-bold"><i class="fas fa-star mr-1"></i><span id="studentStars">0</span> sao</div></div>
      <div id="studentTaskList" class="space-y-5"></div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getFirestore, collection, doc, setDoc, onSnapshot, query, orderBy, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

    // Firebase Web App config from the project you supplied.
    const firebaseConfig = {
      apiKey: 'AIzaSyAB21fpOg3z2h8-K35ybDPvfE9DVATJixs',
      authDomain: 'planning-with-ai-38ae5.firebaseapp.com',
      projectId: 'planning-with-ai-38ae5',
      storageBucket: 'planning-with-ai-38ae5.firebasestorage.app',
      messagingSenderId: '499013875976',
      appId: '1:499013875976:web:1b3c718aec8fda51ad54bd'
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const LOCAL_PREFIX = 'giaobai_family_';
    let familyCode = '';
    let currentUser = '';
    let currentRole = '';
    let currentChild = '';
    let unsubscribeTasks = null;
    let unsubscribeStudents = null;

    function storageKey(){ return LOCAL_PREFIX + familyCode; }
    function getState(){
      try { return JSON.parse(localStorage.getItem(storageKey())) || {students:{},tasks:[],lastSelectedChild:''}; }
      catch { return {students:{},tasks:[],lastSelectedChild:''}; }
    }
    function saveState(state){ localStorage.setItem(storageKey(), JSON.stringify(state)); }
    function escapeHtml(value=''){
      return String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#039;');
    }
    function students(){ return Object.values(getState().students || {}).sort((a,b)=>a.name.localeCompare(b.name,'vi')); }
    function setStudent(name){
      const state=getState();
      if(!name) return;
      if(!state.students[name]) state.students[name]={name,stars:0};
      state.lastSelectedChild=name;
      saveState(state);
    }
    function taskRef(taskId){ return doc(db, `families/${familyCode}/tasks`, taskId); }

    function render(){
      const state=getState();
      const tasks=state.tasks || [];
      const selected=currentRole==='parent' ? currentChild : currentUser;
      const visibleTasks=currentRole==='parent' ? tasks.filter(t=>!currentChild || t.studentName===currentChild) : tasks.filter(t=>t.studentName===currentUser);
      const parentList=document.getElementById('parentTaskList');
      const studentList=document.getElementById('studentTaskList');
      const select=document.getElementById('studentSelect');
      if(select){
        const list=students();
        select.innerHTML=list.length ? list.map(s=>`<option value="${escapeHtml(s.name)}">${escapeHtml(s.name)}</option>`).join('') : '<option value="">Chưa có học sinh</option>';
        if(currentChild && list.some(s=>s.name===currentChild)) select.value=currentChild;
      }
      const board=document.getElementById('leaderboard');
      if(board){
        const list=students().sort((a,b)=>(b.stars||0)-(a.stars||0));
        board.innerHTML=list.length ? list.map((s,i)=>`<div class="flex justify-between items-center p-3 rounded-xl bg-sky-50 border border-sky-100"><span><b class="inline-flex w-7 h-7 rounded-full bg-sky-500 text-white items-center justify-center mr-2">${i+1}</b>${escapeHtml(s.name)}</span><b class="text-orange-600"><i class="fas fa-star mr-1"></i>${s.stars||0}</b></div>`).join('') : '<p class="text-gray-500 italic">Chưa có học sinh nào.</p>';
      }
      document.getElementById('statTotal').textContent=visibleTasks.length;
      document.getElementById('statSubmitted').textContent=visibleTasks.filter(t=>t.status==='submitted').length;
      document.getElementById('statGraded').textContent=visibleTasks.filter(t=>t.status==='graded').length;
      document.getElementById('statStars').textContent=visibleTasks.reduce((n,t)=>n+(Number(t.rewardStars)||0),0);
      const student=getState().students?.[currentUser] || {stars:0};
      document.getElementById('studentStars').textContent=student.stars||0;

      if(parentList){
        parentList.innerHTML=visibleTasks.length ? '' : '<p class="text-gray-500 italic">Chưa có bài tập cho bé này.</p>';
        visibleTasks.forEach(task=>{
          const status=task.status||'assigned';
          const color=status==='assigned'?'bg-gray-500':status==='submitted'?'bg-yellow-500':'bg-green-500';
          parentList.insertAdjacentHTML('beforeend',`<article class="card p-4 border rounded-2xl bg-gray-50"><div class="flex justify-between gap-3"><h3 class="font-bold text-sky-700">${escapeHtml(task.subject)}</h3><span class="status ${color}">${escapeHtml(status)}</span></div><p class="text-xs text-gray-500 mt-1">Học sinh: ${escapeHtml(task.studentName||'')}</p><div class="whitespace-pre-line my-3 text-sm">${escapeHtml(task.content||'')}</div>${status!=='assigned'?`<div class="p-3 bg-white border rounded-xl"><b>Bài làm:</b><p class="whitespace-pre-line">${escapeHtml(task.answer||'')}</p><p class="mt-2 text-purple-700"><b>Nhận xét:</b> ${escapeHtml(task.feedback||'Chưa có nhận xét')}</p><textarea id="fb_${escapeHtml(task.id)}" class="w-full mt-3 p-2 border rounded-lg" placeholder="Nhận xét của phụ huynh">${escapeHtml(task.feedback||'')}</textarea><div class="flex flex-wrap gap-2 mt-2"><button onclick="saveFeedback('${escapeHtml(task.id)}')" class="bg-sky-600 text-white px-3 py-2 rounded-lg text-sm">Lưu nhận xét</button><button onclick="aiGrade('${escapeHtml(task.id)}')" class="bg-purple-100 text-purple-700 px-3 py-2 rounded-lg text-sm">AI chấm thử</button><button onclick="giveReward('${escapeHtml(task.id)}')" class="bg-orange-100 text-orange-700 px-3 py-2 rounded-lg text-sm">Tặng 10 sao</button></div></div>`:''}</article>`);
        });
      }
      if(studentList){
        studentList.innerHTML=visibleTasks.length ? '' : '<p class="text-gray-500 italic">Chưa có bài tập nào cho con.</p>';
        visibleTasks.forEach(task=>{
          const status=task.status||'assigned';
          const color=status==='assigned'?'bg-gray-500':status==='submitted'?'bg-yellow-500':'bg-green-500';
          studentList.insertAdjacentHTML('beforeend',`<article class="card p-5 border-2 rounded-2xl ${status==='graded'?'border-green-300 bg-green-50':'border-sky-300 bg-white'}"><div class="flex justify-between gap-3"><h3 class="font-bold text-lg text-sky-600">${escapeHtml(task.subject)}</h3><span class="status ${color}">${escapeHtml(status)}</span></div><div class="whitespace-pre-line leading-loose my-4">${escapeHtml(task.content||'')}</div>${status==='assigned'?`<textarea id="ans_${escapeHtml(task.id)}" rows="3" class="w-full p-3 border-2 border-dashed border-sky-300 rounded-xl mb-3" placeholder="Nhập câu trả lời của con"></textarea><button onclick="submitTask('${escapeHtml(task.id)}')" class="bg-sky-500 text-white px-5 py-2 rounded-full font-bold">Nộp bài <i class="fas fa-paper-plane"></i></button>`:`<div class="bg-yellow-50 p-4 rounded-xl"><b>Bài làm của con:</b><p class="whitespace-pre-line">${escapeHtml(task.answer||'')}</p><p class="mt-2 text-purple-700"><b>Nhận xét:</b> ${escapeHtml(task.feedback||'Chờ ba mẹ chấm')}</p></div>`}</article>`);
        });
      }
    }

    function watchData(){
      if(unsubscribeTasks) unsubscribeTasks();
      if(unsubscribeStudents) unsubscribeStudents();
      const tasksQuery=query(collection(db,`families/${familyCode}/tasks`),orderBy('createdAt','desc'));
      unsubscribeTasks=onSnapshot(tasksQuery,snapshot=>{
        const state=getState();
        state.tasks=snapshot.docs.map(d=>({...d.data(),id:d.id,createdAt:d.data().createdAt?.toDate?.().toISOString()||d.data().createdAt||''}));
        saveState(state); render();
      },error=>{console.error(error); alert('Không đọc được Firestore. Kiểm tra Firestore đã bật và Security Rules. Dữ liệu cục bộ vẫn được giữ.'); render();});
      unsubscribeStudents=onSnapshot(doc(db,`families/${familyCode}/meta`,`students`),snapshot=>{
        if(snapshot.exists()){
          const state=getState();
          state.students={...state.students,...(snapshot.data().students||{})};
          saveState(state); render();
        }
      },error=>console.warn('Student sync failed:',error));
    }

    async function syncTask(taskId,patch){
      try{await setDoc(taskRef(taskId),patch,{merge:true});}
      catch(error){console.error(error);alert('Đồng bộ Firebase chưa thành công. Hãy kiểm tra Firestore Security Rules.');}
    }
    async function syncStudents(){
      try{await setDoc(doc(db,`families/${familyCode}/meta`,`students`),{students:getState().students},{merge:true});}
      catch(error){console.error(error);alert('Không đồng bộ được danh sách học sinh. Kiểm tra Firestore Security Rules.');}
    }

    function login(role){
      const code=document.getElementById('familyCode').value.trim().toUpperCase();
      const name=document.getElementById('username').value.trim();
      if(!code||!name){alert('Vui lòng nhập mã gia đình và tên.');return;}
      familyCode=code; currentUser=name; currentRole=role;
      if(role==='student'){currentChild=name;setStudent(name);}
      else {const state=getState();currentChild=state.lastSelectedChild||students()[0]?.name||'';}
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById(role==='parent'?'parentDashboard':'studentDashboard').classList.remove('hidden');
      const info=document.getElementById('userInfo');info.classList.remove('hidden');info.classList.add('flex');
      document.getElementById('userNameDisplay').textContent=`Xin chào, ${name}`;
      if(role==='parent'){
        const select=document.getElementById('studentSelect');
        select.onchange=()=>{currentChild=select.value;const state=getState();state.lastSelectedChild=currentChild;saveState(state);render();};
      }
      render(); watchData();
      if(role==='student') syncStudents();
    }
    function logout(){if(unsubscribeTasks)unsubscribeTasks();if(unsubscribeStudents)unsubscribeStudents();location.reload();}
    function addStudent(){
      const input=document.getElementById('newStudentName');const name=input.value.trim();
      if(!name){alert('Nhập tên bé trước.');return;}
      const state=getState();if(!state.students[name])state.students[name]={name,stars:0};state.lastSelectedChild=name;saveState(state);currentChild=name;input.value='';render();syncStudents();
    }
    async function generateTasks(){
      const key=document.getElementById('geminiApiKey').value.trim();
      if(!key){alert('Nhập Gemini API key để tạo bài.');return;}
      const count=Math.max(1,Math.min(20,Number(document.getElementById('questionCount').value)||1));
      const subject=document.getElementById('subject').value;
      const extra=document.getElementById('aiPrompt').value.trim();
      const button=document.getElementById('generateBtn');button.disabled=true;button.textContent='Đang soạn...';
      try{
        const response=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${encodeURIComponent(key)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:`Đóng vai giáo viên tiểu học. Soạn ${count} câu hỏi môn ${subject} cho học sinh lớp 2. Trình bày rõ ràng, mỗi câu cách nhau một dòng. ${extra}`}]}]})});
        const data=await response.json();if(!response.ok||!data.candidates?.[0]?.content?.parts?.[0]?.text)throw new Error(data.error?.message||'Gemini không tạo được bài.');
        const id=`${Date.now()}-${Math.random().toString(16).slice(2)}`;
        const task={id,subject,content:data.candidates[0].content.parts[0].text.trim(),answer:'',status:'assigned',feedback:'',rewardStars:0,studentName:currentChild||'Tất cả',createdAt:new Date().toISOString()};
        const state=getState();state.tasks=[task,...(state.tasks||[])];saveState(state);render();
        await setDoc(taskRef(id),{...task,createdAt:serverTimestamp()});
        document.getElementById('aiPrompt').value='';
      }catch(error){alert('Lỗi tạo bài: '+error.message);}
      finally{button.disabled=false;button.innerHTML='<i class="fas fa-magic mr-2"></i>Tạo bài tập';}
    }
    async function submitTask(id){
      const answer=document.getElementById(`ans_${id}`)?.value.trim();if(!answer){alert('Con chưa nhập câu trả lời.');return;}
      const state=getState();state.tasks=state.tasks.map(t=>t.id===id?{...t,answer,status:'submitted'}:t);saveState(state);render();await syncTask(id,{answer,status:'submitted'});
    }
    async function saveFeedback(id){
      const feedback=document.getElementById(`fb_${id}`)?.value.trim()||'';const state=getState();state.tasks=state.tasks.map(t=>t.id===id?{...t,feedback}:t);saveState(state);render();await syncTask(id,{feedback});
    }
    async function giveReward(id){
      const state=getState();const task=state.tasks.find(t=>t.id===id);if(!task)return;
      if(task.rewardStars){alert('Bài này đã được tặng sao rồi.');return;}
      task.rewardStars=10;task.status='graded';task.feedback=task.feedback||'Đã nhận 10 sao vì hoàn thành tốt!';
      const student=state.students[task.studentName];if(student)student.stars=(Number(student.stars)||0)+10;
      saveState(state);render();await syncTask(id,{rewardStars:10,status:'graded',feedback:task.feedback});await syncStudents();
    }
    async function aiGrade(id){
      const state=getState();const task=state.tasks.find(t=>t.id===id);const key=document.getElementById('geminiApiKey').value.trim();
      if(!task?.answer){alert('Chưa có bài làm để chấm.');return;}if(!key){alert('Nhập Gemini API key trước khi chấm.');return;}
      try{
        const response=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${encodeURIComponent(key)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:`Bạn là giáo viên tiểu học. Hãy nhận xét bài làm một cách tích cực, ngắn gọn, dễ hiểu, nêu điểm đúng và gợi ý sửa nếu cần.\nĐề bài:\n${task.content}\nBài làm:\n${task.answer}`}]}]})});
        const data=await response.json();if(!response.ok||!data.candidates?.[0]?.content?.parts?.[0]?.text)throw new Error(data.error?.message||'Không chấm được bài.');
        task.feedback=data.candidates[0].content.parts[0].text.trim();task.status='graded';saveState(state);render();await syncTask(id,{feedback:task.feedback,status:'graded'});
      }catch(error){alert('Lỗi chấm AI: '+error.message);}
    }

    window.login=login;window.logout=logout;window.addStudent=addStudent;window.generateTasks=generateTasks;window.submitTask=submitTask;window.saveFeedback=saveFeedback;window.giveReward=giveReward;window.aiGrade=aiGrade;
  </script>
</body>
</html>
