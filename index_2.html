<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Góc Học Tập Nhỏ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <style>
        body { min-height: 100vh; }
        .task-card { transition: all 0.2s ease; }
        .task-card:hover { transform: translateY(-1px); }
    </style>
</head>
<body class="bg-sky-50 font-sans text-gray-800">
    <header class="bg-white shadow-md p-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-sky-600">
                <i class="fas fa-graduation-cap"></i> Góc Học Tập
            </h1>
            <div id="userInfo" class="hidden flex items-center gap-4">
                <span id="userNameDisplay" class="font-semibold text-gray-700"></span>
                <span id="coinDisplay" class="hidden text-orange-500 font-bold">
                    <i class="fas fa-star"></i> <span id="coinCount">0</span>
                </span>
                <button onclick="logout()" class="text-red-500 hover:text-red-700 text-sm">
                    <i class="fas fa-sign-out-alt"></i> Đăng xuất
                </button>
            </div>
        </div>
    </header>

    <main id="loginScreen" class="flex items-center justify-center p-4 min-h-[calc(100vh-80px)]">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md text-center">
            <h2 class="text-xl font-bold mb-6 text-gray-800">Đăng Nhập Gia Đình</h2>
            <input type="text" id="familyCode" placeholder="Mã gia đình (VD: GIADINH123)" class="w-full mb-4 p-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-400" />
            <input type="text" id="username" placeholder="Tên của bạn (hoặc tên bé)" class="w-full mb-6 p-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-400" />

            <div class="flex gap-4">
                <button onclick="login('parent')" class="flex-1 bg-sky-500 text-white p-3 rounded-xl hover:bg-sky-600 font-semibold shadow-md transition">
                    <i class="fas fa-user-tie"></i> Phụ Huynh
                </button>
                <button onclick="login('student')" class="flex-1 bg-green-500 text-white p-3 rounded-xl hover:bg-green-600 font-semibold shadow-md transition">
                    <i class="fas fa-child"></i> Học Sinh
                </button>
            </div>
        </div>
    </main>

    <main id="parentDashboard" class="hidden flex-1 p-4 md:p-8 max-w-6xl mx-auto w-full">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="md:col-span-1 bg-white p-6 rounded-2xl shadow-md h-fit">
                <h3 class="font-bold text-lg mb-4 text-sky-700"><i class="fas fa-robot"></i> AI Soạn Bài</h3>
                <input type="password" id="geminiApiKey" placeholder="Nhập API Key Gemini của bạn..." class="w-full mb-4 p-2 text-sm border rounded-lg focus:outline-none focus:ring-1 focus:ring-sky-400" />
                <select id="subject" class="w-full mb-3 p-2 border rounded-lg">
                    <option value="Toán">Môn Toán</option>
                    <option value="Tiếng Việt">Môn Tiếng Việt</option>
                    <option value="Tiếng Anh">Môn Tiếng Anh</option>
                </select>
                <div class="flex gap-2 mb-4 items-center">
                    <input type="number" id="questionCount" value="5" min="1" max="20" class="w-20 p-2 border rounded-lg text-center" />
                    <span class="text-sm text-gray-600">câu hỏi</span>
                </div>
                <textarea id="aiPrompt" rows="3" placeholder="Ghi chú thêm (VD: Toán đố vui, có hình ảnh ẩn dụ...)" class="w-full mb-4 p-2 border rounded-lg text-sm"></textarea>
                <button id="generateBtn" onclick="generateTasks()" class="w-full bg-purple-500 text-white p-3 rounded-xl hover:bg-purple-600 font-bold shadow-md transition">
                    Tạo Bài Tập Mới
                </button>
            </div>

            <div class="md:col-span-2 bg-white p-6 rounded-2xl shadow-md">
                <h3 class="font-bold text-lg mb-4 text-gray-800"><i class="fas fa-tasks"></i> Danh Sách Bài Đã Giao</h3>
                <div id="parentTaskList" class="space-y-4"></div>
            </div>
        </div>
    </main>

    <main id="studentDashboard" class="hidden flex-1 p-4 md:p-8 max-w-4xl mx-auto w-full">
        <div class="bg-white p-6 rounded-3xl shadow-xl border-4 border-green-200">
            <h2 class="text-2xl font-bold text-green-600 mb-6 text-center">🌟 BÀI TẬP CỦA CON 🌟</h2>
            <div id="studentTaskList" class="space-y-6"></div>
        </div>
    </main>

    <script>
        const STORAGE_KEY = 'giaobai_family_tasks';
        let currentUser = null;
        let currentRole = null;
        let familyCode = null;

        function getFamilyTasks() {
            const raw = localStorage.getItem(`${STORAGE_KEY}_${familyCode || 'default'}`);
            return raw ? JSON.parse(raw) : [];
        }

        function saveFamilyTasks(tasks) {
            localStorage.setItem(`${STORAGE_KEY}_${familyCode || 'default'}`, JSON.stringify(tasks));
        }

        function getFamilyCoins() {
            const raw = localStorage.getItem(`giaobai_coins_${familyCode || 'default'}`);
            return raw ? Number(raw) : 0;
        }

        function setFamilyCoins(value) {
            localStorage.setItem(`giaobai_coins_${familyCode || 'default'}`, String(value));
        }

        function updateCoinDisplay() {
            const coinValue = getFamilyCoins();
            const coinCount = document.getElementById('coinCount');
            if (coinCount) coinCount.textContent = coinValue;
            const coinDisplay = document.getElementById('coinDisplay');
            if (coinDisplay && currentRole === 'student') {
                coinDisplay.classList.remove('hidden');
            }
        }

        function login(role) {
            const code = document.getElementById('familyCode').value.trim().toUpperCase();
            const name = document.getElementById('username').value.trim();
            if (!code || !name) {
                alert('Vui lòng nhập đủ Mã gia đình và Tên!');
                return;
            }

            currentUser = name;
            currentRole = role;
            familyCode = code;

            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('userInfo').classList.remove('hidden');
            document.getElementById('userNameDisplay').textContent = `Xin chào, ${name}`;

            if (role === 'parent') {
                document.getElementById('parentDashboard').classList.remove('hidden');
                document.getElementById('studentDashboard').classList.add('hidden');
            } else {
                document.getElementById('studentDashboard').classList.remove('hidden');
                document.getElementById('parentDashboard').classList.add('hidden');
                document.getElementById('coinDisplay').classList.remove('hidden');
            }

            updateCoinDisplay();
            renderTasks();
        }

        function logout() {
            currentUser = null;
            currentRole = null;
            familyCode = null;
            location.reload();
        }

        function escapeHtml(value = '') {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/\"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        async function generateTasks() {
            const apiKey = document.getElementById('geminiApiKey').value.trim();
            if (!apiKey) {
                alert('Vui lòng nhập Gemini API Key để AI soạn bài!');
                return;
            }

            const subject = document.getElementById('subject').value;
            const count = Number(document.getElementById('questionCount').value || 1);
            const promptExtra = document.getElementById('aiPrompt').value.trim();
            const btn = document.getElementById('generateBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang soạn...';

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: `Đóng vai giáo viên tiểu học. Hãy soạn ${count} câu hỏi bài tập môn ${subject} cho học sinh lớp 2. Yêu cầu: trình bày rõ ràng, dễ hiểu, mỗi câu hỏi cách nhau bằng một dòng trống. ${promptExtra}`
                            }]
                        }]
                    })
                });

                const data = await response.json();
                if (!response.ok || !data.candidates || !data.candidates[0]?.content?.parts?.[0]?.text) {
                    throw new Error(data?.error?.message || 'Không thể tạo bài tập từ Gemini.');
                }

                const taskContent = data.candidates[0].content.parts[0].text.trim();
                const tasks = getFamilyTasks();
                const taskId = String(Date.now());
                tasks.unshift({
                    id: taskId,
                    subject,
                    content: taskContent,
                    answer: '',
                    status: 'assigned',
                    feedback: '',
                    createdAt: new Date().toISOString()
                });
                saveFamilyTasks(tasks);
                renderTasks();
                document.getElementById('aiPrompt').value = '';
            } catch (error) {
                alert('Lỗi tạo bài tập: ' + (error.message || error));
            }

            btn.disabled = false;
            btn.innerHTML = 'Tạo Bài Tập Mới';
        }

        function renderTasks() {
            const tasks = getFamilyTasks();
            const parentList = document.getElementById('parentTaskList');
            const studentList = document.getElementById('studentTaskList');

            if (!parentList || !studentList) return;

            parentList.innerHTML = '';
            studentList.innerHTML = '';

            if (!tasks.length) {
                parentList.innerHTML = '<p class="text-gray-500 italic">Chưa có bài tập nào được giao.</p>';
                studentList.innerHTML = '<p class="text-gray-500 italic">Chưa có bài tập nào cho con.</p>';
                return;
            }

            tasks.forEach((task) => {
                const taskContent = escapeHtml(task.content || '');
                const answerText = escapeHtml(task.answer || '');
                const feedbackText = escapeHtml(task.feedback || '');
                const statusClass = task.status === 'assigned' ? 'bg-gray-500' : task.status === 'submitted' ? 'bg-yellow-500' : 'bg-green-500';

                if (currentRole === 'student') {
                    studentList.insertAdjacentHTML('beforeend', `
                        <div class="task-card p-5 border-2 rounded-2xl ${task.status === 'graded' ? 'border-green-300 bg-green-50' : 'border-sky-300 bg-white'}">
                            <h4 class="font-bold text-lg text-sky-600 mb-2">Môn: ${escapeHtml(task.subject)}</h4>
                            <div class="whitespace-pre-line leading-loose text-gray-700 font-medium mb-4">${taskContent}</div>
                            ${task.status === 'assigned' ? `
                                <textarea id="ans_${task.id}" rows="3" placeholder="Nhập câu trả lời của con vào đây nhé..." class="w-full p-3 border-2 border-dashed border-sky-300 rounded-xl mb-3 focus:outline-none focus:border-sky-500"></textarea>
                                <button onclick="submitTask('${task.id}')" class="bg-sky-500 text-white px-6 py-2 rounded-full font-bold shadow-md hover:bg-sky-600">Nộp Bài <i class="fas fa-paper-plane"></i></button>
                            ` : `
                                <div class="bg-yellow-50 p-4 rounded-xl border border-yellow-200">
                                    <p class="font-bold text-gray-700">Bài làm của con:</p>
                                    <p class="whitespace-pre-line text-gray-600 leading-relaxed">${answerText || 'Chưa có câu trả lời.'}</p>
                                    <p class="font-bold text-purple-600 mt-2">Nhận xét: ${feedbackText || 'Chờ ba mẹ chấm...'}</p>
                                </div>
                            `}
                        </div>
                    `);
                }

                if (currentRole === 'parent') {
                    parentList.insertAdjacentHTML('beforeend', `
                        <div class="task-card p-4 border rounded-xl bg-gray-50">
                            <h4 class="font-bold text-sky-700 mb-2">
                                Môn: ${escapeHtml(task.subject)}
                                <span class="uppercase text-xs text-white px-2 py-1 rounded ml-2 ${statusClass}">${task.status}</span>
                            </h4>
                            <div class="whitespace-pre-line leading-relaxed text-sm mt-2 text-gray-600">${taskContent}</div>

                            ${task.status === 'submitted' ? `
                                <div class="mt-3 p-3 bg-white border rounded-lg">
                                    <p class="text-sm font-semibold">Bé trả lời:</p>
                                    <p class="text-sm italic whitespace-pre-line text-gray-700">${answerText || 'Chưa có câu trả lời.'}</p>
                                    <div class="mt-3 flex flex-wrap gap-2">
                                        <button onclick="aiGrade('${task.id}', ${JSON.stringify(task.content)})" class="bg-purple-100 text-purple-700 px-3 py-1 rounded-lg text-sm hover:bg-purple-200"><i class="fas fa-magic"></i> AI Chấm Thử</button>
                                        <button onclick="giveReward('${task.id}')" class="bg-orange-100 text-orange-700 px-3 py-1 rounded-lg text-sm hover:bg-orange-200"><i class="fas fa-star"></i> Tặng Sao/Tiền ảo</button>
                                    </div>
                                    <textarea id="fb_${task.id}" class="w-full mt-2 p-2 text-sm border rounded" placeholder="Nhận xét chốt lại của ba mẹ...">${feedbackText}</textarea>
                                    <button onclick="saveFeedback('${task.id}')" class="mt-2 bg-sky-600 text-white px-3 py-1 rounded hover:bg-sky-700 text-sm">Lưu nhận xét</button>
                                </div>
                            ` : ''}
                        </div>
                    `);
                }
            });
        }

        async function submitTask(taskId) {
            const ans = document.getElementById(`ans_${taskId}`)?.value.trim();
            if (!ans) {
                alert('Con chưa nhập câu trả lời kìa!');
                return;
            }

            const tasks = getFamilyTasks();
            const updated = tasks.map(task => {
                if (task.id === taskId) {
                    return { ...task, answer: ans, status: 'submitted' };
                }
                return task;
            });
            saveFamilyTasks(updated);
            renderTasks();
        }

        function saveFeedback(taskId) {
            const feedback = document.getElementById(`fb_${taskId}`)?.value.trim() || '';
            const tasks = getFamilyTasks();
            const updated = tasks.map(task => {
                if (task.id === taskId) {
                    return { ...task, feedback };
                }
                return task;
            });
            saveFamilyTasks(updated);
            renderTasks();
        }

        function giveReward(taskId) {
            const tasks = getFamilyTasks();
            const updated = tasks.map(task => {
                if (task.id === taskId) {
                    const reward = 10;
                    const currentCoins = getFamilyCoins();
                    setFamilyCoins(currentCoins + reward);
                    updateCoinDisplay();
                    return { ...task, status: 'graded', feedback: task.feedback || 'Đã khen thưởng 10 sao cho con!' };
                }
                return task;
            });
            saveFamilyTasks(updated);
            renderTasks();
        }

        async function aiGrade(taskId, taskContent) {
            const tasks = getFamilyTasks();
            const task = tasks.find(item => item.id === taskId);
            if (!task || !task.answer) {
                alert('Chưa có bài làm để chấm.');
                return;
            }

            const apiKey = document.getElementById('geminiApiKey').value.trim();
            if (!apiKey) {
                alert('Vui lòng nhập Gemini API Key trước khi chấm AI!');
                return;
            }

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: `Bạn là giáo viên tiểu học. Hãy chấm bài làm của học sinh theo đề bài dưới đây. Viết ngắn gọn, tích cực, dễ hiểu cho trẻ. Đánh giá đúng/sai, khen điểm tốt, và đưa ra nhận xét 2-3 câu.\n\nĐề bài:\n${taskContent}\n\nBài làm của học sinh:\n${task.answer}`
                            }]
                        }]
                    })
                });

                const data = await response.json();
                if (!response.ok || !data.candidates?.[0]?.content?.parts?.[0]?.text) {
                    throw new Error(data?.error?.message || 'Không thể chấm bài bằng AI.');
                }

                const result = data.candidates[0].content.parts[0].text.trim();
                const updated = tasks.map(item => item.id === taskId ? { ...item, feedback: result, status: 'graded' } : item);
                saveFamilyTasks(updated);
                renderTasks();
            } catch (error) {
                alert('Lỗi chấm AI: ' + (error.message || error));
            }
        }

        window.login = login;
        window.logout = logout;
        window.generateTasks = generateTasks;
        window.submitTask = submitTask;
        window.saveFeedback = saveFeedback;
        window.giveReward = giveReward;
        window.aiGrade = aiGrade;
    </script>
</body>
</html>
